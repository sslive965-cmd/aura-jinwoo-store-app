name: Build AURA JINWOO STORE APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf /tmp/aura-project
          mkdir -p /tmp/aura-project

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d /tmp/aura-project

          SETTINGS_FILE="$(find /tmp/aura-project -type f -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found inside ZIP."
            find /tmp/aura-project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project found at: $PROJECT_DIR"

          test -d "$PROJECT_DIR/app"

          cp -r "$PROJECT_DIR/app" .
          cp "$PROJECT_DIR/settings.gradle.kts" .
          cp "$PROJECT_DIR/build.gradle.kts" .
          cp "$PROJECT_DIR/gradle.properties" . 2>/dev/null || true

          echo "Android project extracted successfully."

      - name: Fix Kotlin duplicate stdlib
        shell: bash
        run: |
          set -e

          cat >> app/build.gradle.kts <<'EOF'

          configurations.all {
              exclude(
                  group = "org.jetbrains.kotlin",
                  module = "kotlin-stdlib-jdk8"
              )
          }
          EOF

          echo "Kotlin duplicate stdlib fix added."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Find APK
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-jinwoo-store-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
