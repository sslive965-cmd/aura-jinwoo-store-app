name: Build AURA JINWOO STORE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf /tmp/aura-project
          mkdir -p /tmp/aura-project
          unzip -q AuraJinwooStore_NewApp_With_Logo.zip -d /tmp/aura-project
run: |
          rm -rf /tmp/aura-project
          mkdir -p /tmp/aura-project
          unzip -q AuraJinwooStore_NewApp_With_Logo.zip -d /tmp/aura-project

          PROJECT_DIR="$(find /tmp/aura-project -type f -name settings.gradle.kts -print -quit | xargs dirname)"

          echo "Android project found at: $PROJECT_DIR"

          test -d "$PROJECT_DIR/app"

          cp -r "$PROJECT_DIR/app" .
          cp "$PROJECT_DIR/settings.gradle.kts" .
          cp "$PROJECT_DIR/build.gradle.kts" .
          cp "$PROJECT_DIR/gradle.properties" .
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-jinwoo-store-apk
          path: app/build/outputs/apk/debug/app-debug.apk
